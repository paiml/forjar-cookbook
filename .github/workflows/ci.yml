name: CI
on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-llvm-cov
      - run: cargo llvm-cov --workspace --lib --lcov --output-path lcov.info
      - run: ./scripts/coverage-check.sh

  validate-recipes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install forjar
        run: cargo install forjar --locked
      - name: Validate all recipes (98/98 must pass)
        run: cargo run --example validate_all
      - name: Plan all recipes (98/98 must pass)
        run: cargo run --example plan_all

  score:
    runs-on: ubuntu-latest
    needs: validate-recipes
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Score all recipes (static analysis)
        run: cargo run --example score_all

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-docs-consistency.sh

  # Emits the status context `gate`, which the paiml org ruleset "Green Main"
  # (id 13878864) requires on every PR. No workflow here emitted it, so PRs sat
  # at mergeStateStatus BLOCKED with every visible check green and no way for a
  # contributor to fix it. This job is an aggregator, not a rubber stamp: it
  # fails if ANY upstream CI job did not succeed, and it fails if it is not
  # aggregating every job in this workflow (so adding a job without wiring it
  # here is a hard error, never a silent hole in the gate).
  gate:
    name: gate
    runs-on: ubuntu-latest
    needs: [check, test, coverage, validate-recipes, score, docs]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Aggregate CI job results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          # Aggregate CI job results. Same messages and exit codes as the earlier script.
          text_jobs=$(awk 'f{print} /^jobs:$/{f=1}' .github/workflows/ci.yml)
          if [ -z "$text_jobs" ]; then
              echo "FAIL: could not locate the jobs: block in .github/workflows/ci.yml" >&2
              exit 1
          fi
          declared=$(printf '%s\n' "$text_jobs" | grep -oE '^  [A-Za-z0-9_-]+:' | sed -E 's/^  //; s/:$//' | grep -v '^gate$' | LC_ALL=C sort -u || true)
          if [ -z "$declared" ]; then
              echo "FAIL: parsed 0 jobs from .github/workflows/ci.yml" >&2
              exit 1
          fi
          aggregated=$(printf '%s' "$NEEDS_JSON" | jq -r 'keys[]' | LC_ALL=C sort -u)
          n_declared=$(printf '%s\n' "$declared" | wc -l)
          n_agg=$(printf '%s' "$NEEDS_JSON" | jq 'length')
          echo "ci.yml declares ${n_declared} job(s) besides gate; gate aggregates ${n_agg}."
          missing=$(comm -23 <(printf '%s\n' "$declared") <(printf '%s\n' "$aggregated") | paste -sd, - | sed 's/,/, /g')
          unknown=$(comm -13 <(printf '%s\n' "$declared") <(printf '%s\n' "$aggregated") | paste -sd, - | sed 's/,/, /g')
          if [ -n "$missing" ]; then
              n=$(comm -23 <(printf '%s\n' "$declared") <(printf '%s\n' "$aggregated") | wc -l)
              echo "FAIL: gate does not depend on ${n} CI job(s): ${missing}" >&2
              exit 1
          fi
          if [ -n "$unknown" ]; then
              n=$(comm -13 <(printf '%s\n' "$declared") <(printf '%s\n' "$aggregated") | wc -l)
              echo "FAIL: gate depends on ${n} job(s) not in ci.yml: ${unknown}" >&2
              exit 1
          fi
          printf '%s' "$NEEDS_JSON" | jq -r 'to_entries | sort_by(.key)[] | "  \(.key): \(.value.result)"'
          total=$(printf '%s' "$NEEDS_JSON" | jq 'length')
          bad=$(printf '%s' "$NEEDS_JSON" | jq -r 'to_entries | map(select(.value.result != "success")) | sort_by(.key)[] | .key' | paste -sd, - | sed 's/,/, /g')
          if [ -n "$bad" ]; then
              n=$(printf '%s' "$NEEDS_JSON" | jq '[to_entries[] | select(.value.result != "success")] | length')
              echo "FAIL: ${n} of ${total} CI job(s) did not succeed: ${bad}" >&2
              exit 1
          fi
          echo "OK: ${total} of ${total} CI job(s) succeeded."
